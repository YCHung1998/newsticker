[package]
name = "ticker-connect"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonschema = { version = "0.60.1", default-features = false }
reqwest = "0.13.5"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
